<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SharkTV - Series</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#000;color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}body{-webkit-tap-highlight-color:transparent}.header{position:relative;width:100%;height:320px;background-size:cover;background-position:center;display:flex;align-items:center;padding:20px;overflow:hidden;z-index:1}.header::before{content:"";position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.89) 0%,rgba(0,0,0,0) 40%),linear-gradient(to bottom,rgba(0,0,0,0) 20%,rgba(0,0,0,1) 100%);z-index:1}.header.active::before{background:linear-gradient(to right,rgba(0,0,0,.89) 0%,rgba(0,0,0,.89) 40%,rgba(0,0,0,0) 100%),linear-gradient(to bottom,rgba(0,0,0,0) 20%,rgba(0,0,0,1) 100%)}.header-info-container{position:relative;z-index:2;max-width:500px;width:100%}.header-info img{max-width:300px;max-height:80px;display:block;margin-bottom:14px;object-fit:contain;object-position:left}.episode-title{font-size:16px;line-height:1.4;margin:4px 0 6px;font-weight:bold}.details{font-size:13px;font-weight:bold;margin:4px 0}.overview{font-size:12px;line-height:1.45;max-height:100px;overflow:auto;margin:8px 0 0}.content{padding:20px}.season-row{display:none;margin-bottom:25px}.season-title{font-size:18px;margin-bottom:10px}.episodes-list{display:flex;gap:12px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;padding-bottom:5px}.episodes-list::-webkit-scrollbar{display:none}.episode-thumb{position:relative;flex:0 0 auto;width:220px;cursor:pointer;touch-action:pan-x;border-radius:4px;overflow:hidden;border:3px solid transparent;outline:none!important;box-shadow:none!important;transition:border .2s ease;text-decoration:none;background:transparent}.episode-thumb img{width:100%;height:124px;object-fit:cover;display:block;border-radius:2px}
.episode-duration{position:absolute;right:8px;bottom:8px;z-index:2;padding:4px 7px;border-radius:4px;background:rgba(0,0,0,.78);color:#fff;font-size:12px;font-weight:700;line-height:1;pointer-events:none;text-shadow:0 1px 2px #000}.episode-thumb.selected,.episode-thumb:focus{border:3px solid #E50914!important;outline:none!important;box-shadow:none!important;transform:none}.episode-thumb,.episode-thumb img{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}*:focus,*:focus-visible{outline:none!important;box-shadow:none!important}.status{color:#aaa;padding:10px 0}@media(max-width:600px){.header{height:260px;padding:15px}.header-info-container{max-width:88%}.header-info img{max-width:220px;max-height:65px}.episode-title{font-size:16px}.details{font-size:12px}.overview{font-size:11px;max-height:75px}.content{padding:15px}.episode-thumb{width:180px}.episode-thumb img{height:101px}}

/* SINOPSIS COMPLETA EN LA CABECERA: el texto no se recorta.
   Si no cabe en la altura del banner, la zona informativa permite desplazarse. */
.header-info,
.header-info-container{
  max-height:calc(100% - 24px)!important;
  overflow-y:auto!important;
  overflow-x:hidden!important;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.55) rgba(0,0,0,.18);
  overscroll-behavior:contain;
}
.overview{
  display:block!important;
  max-height:none!important;
  height:auto!important;
  overflow:visible!important;
  -webkit-line-clamp:unset!important;
  line-clamp:unset!important;
  white-space:normal!important;
  overflow-wrap:anywhere;
}

</style></head><body>
<div class="header active" id="header"><div class="header-info-container" id="header-info-container"><div class="header-info" id="header-info"></div></div></div><div class="content"><div id="series-container"></div><p id="status" class="status">Cargando contenido...</p></div>
<script>
'use strict';const header=document.getElementById('header'),headerInfo=document.getElementById('header-info'),container=document.getElementById('series-container'),statusEl=document.getElementById('status');let seasonRows=[],currentSeasonIndex=0,currentEpisodeIndex=0,episodesBySeason=[],episodeRecords=[],selectedEpisodeItem=null,sharkEpisodeInfoTimer=null;const params=new URLSearchParams(location.search),seriesId=params.get('id');
async function readJson(file){const r=await fetch('./'+file+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(file+' HTTP '+r.status);return r.json()}
async function iniciar(){if(!seriesId){statusEl.textContent='No se ha indicado qué serie mostrar.';return}try{const [series,episodeData]=await Promise.all([readJson('series.json'),readJson('episodios.json')]);const serie=series.find(s=>String(s.id||s.tmdb_id)===String(seriesId));if(!serie){statusEl.textContent='No se encontró la serie en series.json.';return}const temporadas=episodeData[String(serie.id)]||episodeData[String(serie.tmdb_id)]||[];header.style.backgroundImage=serie.backdrop_manual||serie.backdrop?'url("'+(serie.backdrop_manual||serie.backdrop)+'")':'none';headerInfo.replaceChildren();const logoUrl=serie.logo_manual||serie.logo;if(logoUrl){const logo=document.createElement('img');logo.src=logoUrl;logo.alt=serie.title||'';logo.onerror=()=>{logo.remove();if(!headerInfo.querySelector('.series-fallback')){const h=document.createElement('div');h.className='series-fallback';h.textContent=serie.title||'Serie';h.style.cssText='font-size:28px;font-weight:bold;margin-bottom:12px';headerInfo.prepend(h)}};headerInfo.appendChild(logo)}else{const h=document.createElement('div');h.className='series-fallback';h.textContent=serie.title||'Serie';h.style.cssText='font-size:28px;font-weight:bold;margin-bottom:12px';headerInfo.appendChild(h)}const epTitle=document.createElement('h1');epTitle.className='episode-title';epTitle.id='episode-title';epTitle.textContent='';headerInfo.appendChild(epTitle);const overview=document.createElement('p');overview.className='overview';overview.id='episode-overview';overview.textContent=serie.overview||'';headerInfo.appendChild(overview);container.replaceChildren();seasonRows=[];episodesBySeason=[];episodeRecords=[];temporadas.sort((a,b)=>Number(a.numero)-Number(b.numero)).forEach((t,i)=>crearTemporada(t,i));if(!seasonRows.length){statusEl.textContent='Todavía no hay capítulos detectados para esta serie. Comprueba que los vídeos tengan S01E01 en el título.';return}statusEl.hidden=true;mostrarTemporada(0);seleccionarPrimero()}catch(e){console.error(e);statusEl.textContent='No se pudo cargar la serie. Comprueba series.json y episodios.json.'}}
function actualizarFicha(ep,index){const season=Number((seasonRows[currentSeasonIndex]||{}).dataset?.seasonNumber||currentSeasonIndex+1);const title=document.getElementById('episode-title'),overview=document.getElementById('episode-overview');if(title)title.textContent='T'+String(season).padStart(1,'0')+' - E'+String(ep.numero).padStart(2,'0')+' - '+(ep.titulo||'Capítulo '+ep.numero);if(overview)overview.textContent=ep.sinopsis||ep.overview||'Sin sinopsis disponible para este capítulo.'}
function crearTemporada(temporada,index){const row=document.createElement('div');row.className='season-row';row.dataset.seasonNumber=temporada.numero;const title=document.createElement('div');title.className='season-title';title.textContent='Temporada '+temporada.numero;const list=document.createElement('div');list.className='episodes-list';const eps=(temporada.capitulos||[]).slice().sort((a,b)=>Number(a.numero)-Number(b.numero));eps.forEach((ep,epIndex)=>{const item=document.createElement('a');item.className='episode-thumb';item.href='#';item.tabIndex=0;item.dataset.season=String(index);item.dataset.episode=String(epIndex);const img=document.createElement('img');img.loading='lazy';img.alt='';img.src=ep.imagen||'';img.onerror=()=>{img.style.visibility='hidden'};item.append(img);const duration=ep.duracion??ep.duration??ep.runtime??ep.duracion_minutos??null;if(duration!==null&&duration!==undefined&&duration!==''){const badge=document.createElement('span');badge.className='episode-duration';const minutes=Number(duration);badge.textContent=Number.isFinite(minutes)&&minutes>0?(minutes>=60?Math.floor(minutes/60)+' h '+String(minutes%60).padStart(2,'0')+' min':Math.round(minutes)+' min'):String(duration);item.append(badge)}item.addEventListener('focus',()=>{currentSeasonIndex=index;currentEpisodeIndex=epIndex;updateSelected()});item.addEventListener('click',e=>{e.preventDefault();currentSeasonIndex=index;currentEpisodeIndex=epIndex;updateSelected();openCurrent()});list.appendChild(item)});row.append(title,list);container.appendChild(row);seasonRows.push(row);episodesBySeason.push([...list.querySelectorAll('.episode-thumb')]);episodeRecords.push(eps)}
function mostrarTemporada(index){
    if(index<0||index>=seasonRows.length)return;
    const showAllOnPhone=window.matchMedia('(orientation: portrait) and (pointer: coarse)').matches;
    seasonRows.forEach((row,i)=>{
        row.style.setProperty('display',showAllOnPhone?'block':(i===index?'block':'none'),'important');
        row.style.setProperty('visibility','visible','important');
    });
    currentSeasonIndex=index;
    currentEpisodeIndex=0;
    updateSelected();
    const activeSeason=seasonRows[index];
    if(activeSeason){
        activeSeason.scrollIntoView({block:'nearest',inline:'nearest',behavior:showAllOnPhone?'smooth':'auto'});
    }
}
function updateSelected(){
    const item=(episodesBySeason[currentSeasonIndex]||[])[currentEpisodeIndex];
    const ep=(episodeRecords[currentSeasonIndex]||[])[currentEpisodeIndex];

    if(ep){clearTimeout(sharkEpisodeInfoTimer);sharkEpisodeInfoTimer=setTimeout(()=>{if((episodeRecords[currentSeasonIndex]||[])[currentEpisodeIndex]===ep)actualizarFicha(ep,currentEpisodeIndex)},90);}

    if(item){
        if(selectedEpisodeItem!==item){
            if(selectedEpisodeItem)selectedEpisodeItem.classList.remove('selected');
            item.classList.add('selected');
            selectedEpisodeItem=item;
        }

        if(document.activeElement!==item)item.focus({preventScroll:true});

        const rect=item.getBoundingClientRect();
        const parent=item.parentElement;
        const bounds=parent?parent.getBoundingClientRect():null;
        if(bounds&&(rect.left<bounds.left||rect.right>bounds.right)){
            item.scrollIntoView({block:'nearest',inline:'nearest',behavior:'auto'});
        }
    }
}
function seleccionarPrimero(){currentEpisodeIndex=0;updateSelected()}
function openCurrent(){const ep=(episodeRecords[currentSeasonIndex]||[])[currentEpisodeIndex];if(ep&&ep.url)window.open(ep.url,'_blank','noopener')}
document.addEventListener('keydown',e=>{
    const k=e.key,c=e.keyCode||e.which;
    const up=k==='ArrowUp'||c===38||c===19;
    const down=k==='ArrowDown'||c===40||c===20;
    const left=k==='ArrowLeft'||c===37||c===21;
    const right=k==='ArrowRight'||c===39||c===22;
    const enter=k==='Enter'||c===13||c===23||c===66;
    const back=k==='Escape'||c===27||c===4;

    if(back){e.preventDefault();location.href='index.html';return}
    if(!seasonRows.length)return;

    if(enter){
        e.preventDefault();
        openCurrent();
        return;
    }

    if(left||right){
        const arr=episodesBySeason[currentSeasonIndex]||[];
        if(!arr.length)return;
        e.preventDefault();
        currentEpisodeIndex=Math.max(0,Math.min(arr.length-1,currentEpisodeIndex+(right?1:-1)));
        updateSelected();
        return;
    }

    if(up||down){
        if(seasonRows.length<2)return;
        e.preventDefault();
        const next=currentSeasonIndex+(down?1:-1);
        if(next>=0&&next<seasonRows.length){
            mostrarTemporada(next);
            seleccionarPrimero();
        }
    }
},true);iniciar();
</script>
<style id="sharktv-mobile-show-all-seasons">
/* En móvil vertical se muestran todas las temporadas, no solo la seleccionada */
@media screen and (orientation:portrait){
  #series-container .season-row{display:block!important;visibility:visible!important;}
  .season-title{display:block!important;}
  .episodes-list{display:flex!important;visibility:visible!important;}
}
</style>

<style id="sharktv-series-banner-and-season-navigation-like-peliculas">
/* Cabecera fija como en PELICULAS: el banner queda de fondo y el catálogo pasa por delante. */
.header{
  position:fixed!important;top:0!important;left:0!important;right:0!important;
  width:100%!important;height:520px!important;min-height:520px!important;
  padding:20px!important;z-index:0!important;overflow:hidden!important;
  background-color:#000!important;background-position:center center!important;
  background-size:cover!important;background-repeat:no-repeat!important;
  align-items:flex-start!important;
}
.header::before,.header:before{
  content:""!important;position:absolute!important;inset:0!important;
  background:linear-gradient(to right,rgba(0,0,0,.90) 0%,rgba(0,0,0,.55) 35%,transparent 100%),
  linear-gradient(to bottom,rgba(0,0,0,.12) 42%,rgba(0,0,0,.58) 68%,#000 100%)!important;
  pointer-events:none!important;z-index:1!important;
}
.header-info-container,.header-info,#header-info{
  position:absolute!important;top:160px!important;left:20px!important;right:20px!important;
  transform:translateY(-50%)!important;z-index:2!important;width:auto!important;
  max-width:500px!important;max-height:calc(100% - 24px)!important;
  overflow-y:auto!important;overflow-x:hidden!important;box-sizing:border-box!important;
}
.header-info img,.header h1 img,#header-info img{
  display:block!important;width:auto!important;max-width:min(300px,76vw)!important;
  max-height:80px!important;object-fit:contain!important;object-position:left center!important;
}
.content{position:relative!important;z-index:1!important;margin-top:320px!important;}
@media screen and (max-width:600px){
 .header{height:430px!important;min-height:430px!important;padding:15px!important;}
 .header::before,.header:before{
  background:linear-gradient(to right,rgba(0,0,0,.90) 0%,rgba(0,0,0,.55) 35%,transparent 100%),
  linear-gradient(to bottom,rgba(0,0,0,.12) 48%,rgba(0,0,0,.58) 74%,#000 100%)!important;
 }
 .header-info-container,.header-info,#header-info{top:160px!important;left:15px!important;right:15px!important;}
 .header-info img,.header h1 img,#header-info img{max-width:min(240px,76vw)!important;max-height:70px!important;}
 .content{margin-top:320px!important;padding:12px 15px!important;}
}
/* En móvil vertical, todas las temporadas quedan en columna y se puede recorrer la página. */
@media screen and (orientation:portrait) and (pointer:coarse){
 #series-container .season-row{display:block!important;visibility:visible!important;}
 #series-container{display:block!important;}
 .season-row{margin-bottom:25px!important;}
 .episodes-list{width:100%!important;max-width:100%!important;overflow-x:auto!important;overscroll-behavior-x:contain;}
}

/* La página SERIES tiene un contenedor interior para la ficha; evitar aplicar dos veces el desplazamiento vertical. */
.header-info-container>.header-info{position:relative!important;top:auto!important;left:auto!important;right:auto!important;transform:none!important;width:100%!important;max-height:100%!important;}
</style>


<style id="sharktv-mobile-synopsis-card-effect">
@media screen and (max-width:600px) and (orientation:portrait){
 .movie-row .movie,.episodes-list .episode-thumb{transition:none!important;}
}
</style>
<script id="sharktv-mobile-synopsis-card-effect-script">
(function(){
 const mq=window.matchMedia('(max-width:600px) and (orientation:portrait)');
 let raf=0,observer=null,resizeObserver=null;
 function getCards(){return Array.from(document.querySelectorAll('.movie-row > *, .season-row > .season-title, .episodes-list > .episode-thumb'));}
 function getSynopsis(){
  return document.querySelector('#episode-overview, #overview, .overview, #header-info .synopsis, #header-info .description, #header-info p, #header-info .description-text')||document.querySelector('#header-info');
 }
 function update(){
  raf=0;
  const cards=getCards();
  if(!mq.matches){
   cards.forEach(card=>{card.style.removeProperty('opacity');card.style.removeProperty('transition');card.style.removeProperty('pointer-events');});
   return;
  }
  const synopsis=getSynopsis();if(!synopsis)return;
  const boundary=synopsis.getBoundingClientRect().top,hideBefore=100;
  cards.forEach(card=>{
   const visible=card.getBoundingClientRect().bottom>boundary+hideBefore?1:0;
   card.style.setProperty('transition','none');
   card.style.setProperty('opacity',String(visible),'important');
   card.style.setProperty('pointer-events',visible===0?'none':'auto');
  });
 }
 function request(){if(!raf)raf=requestAnimationFrame(update);}
 function init(){
  window.addEventListener('scroll',request,{passive:true,capture:true});
  document.addEventListener('scroll',request,{passive:true,capture:true});
  document.addEventListener('touchmove',request,{passive:true});
  if(window.visualViewport)window.visualViewport.addEventListener('scroll',request,{passive:true});
  if(observer)observer.disconnect();
  observer=new MutationObserver(request);observer.observe(document.body,{childList:true,subtree:true,characterData:true});
  if(window.ResizeObserver){resizeObserver=new ResizeObserver(request);const synopsis=getSynopsis();if(synopsis)resizeObserver.observe(synopsis);}
  request();
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
 if(mq.addEventListener)mq.addEventListener('change',request);else mq.addListener(request);
 window.addEventListener('resize',request,{passive:true});
})();
</script>
