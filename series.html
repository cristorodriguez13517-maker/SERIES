<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SharkTV - Series</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#000;color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}body{-webkit-tap-highlight-color:transparent}.header{position:relative;width:100%;height:320px;background-size:cover;background-position:center;display:flex;align-items:center;padding:20px;overflow:hidden;z-index:1}.header::before{content:"";position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.89) 0%,rgba(0,0,0,0) 40%),linear-gradient(to bottom,rgba(0,0,0,0) 20%,rgba(0,0,0,1) 100%);z-index:1}.header.active::before{background:linear-gradient(to right,rgba(0,0,0,.89) 0%,rgba(0,0,0,.89) 40%,rgba(0,0,0,0) 100%),linear-gradient(to bottom,rgba(0,0,0,0) 20%,rgba(0,0,0,1) 100%)}.header-info-container{position:relative;z-index:2;max-width:500px;width:100%}.header-info img{max-width:300px;max-height:80px;display:block;margin-bottom:14px;object-fit:contain;object-position:left}.episode-title{font-size:19px;line-height:1.35;margin:0 0 8px;font-weight:bold}.details{font-size:13px;font-weight:bold;margin:4px 0}.overview{font-size:12px;line-height:1.45;max-height:100px;overflow:auto;margin:8px 0 0}.content{padding:20px}.season-row{display:none;margin-bottom:25px}.season-title{font-size:18px;margin-bottom:10px}.episodes-list{display:flex;gap:12px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none;padding-bottom:5px}.episodes-list::-webkit-scrollbar{display:none}.episode-thumb{position:relative;flex:0 0 auto;width:220px;cursor:pointer;touch-action:pan-x;border-radius:4px;overflow:hidden;border:3px solid transparent;outline:none!important;box-shadow:none!important;transition:border .2s ease;text-decoration:none;background:transparent}.episode-thumb img{width:100%;height:124px;object-fit:cover;display:block;border-radius:2px}.episode-thumb.selected{border:3px solid #E50914;outline:none!important;box-shadow:none!important;transform:none}.episode-thumb,.episode-thumb img{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}*:focus,*:focus-visible{outline:none!important;box-shadow:none!important}.status{color:#aaa;padding:10px 0}@media(max-width:600px){.header{height:260px;padding:15px}.header-info-container{max-width:88%}.header-info img{max-width:220px;max-height:65px}.episode-title{font-size:16px}.details{font-size:12px}.overview{font-size:11px;max-height:75px}.content{padding:15px}.episode-thumb{width:180px}.episode-thumb img{height:101px}}
</style></head><body>
<div class="header active" id="header"><div class="header-info-container" id="header-info-container"><div class="header-info" id="header-info"></div></div></div><div class="content"><div id="series-container"></div><p id="status" class="status">Cargando serie...</p></div>
<script>
'use strict';const header=document.getElementById('header'),headerInfo=document.getElementById('header-info'),container=document.getElementById('series-container'),statusEl=document.getElementById('status');let seasonRows=[],currentSeasonIndex=0,currentEpisodeIndex=0,episodesBySeason=[],episodeRecords=[];const params=new URLSearchParams(location.search),seriesId=params.get('id');
async function readJson(file){const r=await fetch('./'+file+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(file+' HTTP '+r.status);return r.json()}
async function iniciar(){if(!seriesId){statusEl.textContent='No se ha indicado qué serie mostrar.';return}try{const [series,episodeData]=await Promise.all([readJson('series.json'),readJson('episodios.json')]);const serie=series.find(s=>String(s.id||s.tmdb_id)===String(seriesId));if(!serie){statusEl.textContent='No se encontró la serie en series.json.';return}const temporadas=episodeData[String(serie.id)]||episodeData[String(serie.tmdb_id)]||[];header.style.backgroundImage=serie.backdrop_manual||serie.backdrop?'url("'+(serie.backdrop_manual||serie.backdrop)+'")':'none';headerInfo.replaceChildren();const logoUrl=serie.logo_manual||serie.logo;if(logoUrl){const logo=document.createElement('img');logo.src=logoUrl;logo.alt=serie.title||'';logo.onerror=()=>{logo.remove();if(!headerInfo.querySelector('.series-fallback')){const h=document.createElement('div');h.className='series-fallback';h.textContent=serie.title||'Serie';h.style.cssText='font-size:28px;font-weight:bold;margin-bottom:12px';headerInfo.prepend(h)}};headerInfo.appendChild(logo)}else{const h=document.createElement('div');h.className='series-fallback';h.textContent=serie.title||'Serie';h.style.cssText='font-size:28px;font-weight:bold;margin-bottom:12px';headerInfo.appendChild(h)}const epTitle=document.createElement('h1');epTitle.className='episode-title';epTitle.id='episode-title';epTitle.textContent='';headerInfo.appendChild(epTitle);const details=document.createElement('div');details.className='details';details.id='episode-details';details.textContent=[serie.first_air_date?String(serie.first_air_date).slice(0,4):'',serie.genres||''].filter(Boolean).join(' | ');headerInfo.appendChild(details);const overview=document.createElement('p');overview.className='overview';overview.id='episode-overview';overview.textContent=serie.overview||'';headerInfo.appendChild(overview);container.replaceChildren();seasonRows=[];episodesBySeason=[];episodeRecords=[];temporadas.sort((a,b)=>Number(a.numero)-Number(b.numero)).forEach((t,i)=>crearTemporada(t,i));if(!seasonRows.length){statusEl.textContent='Todavía no hay capítulos detectados para esta serie. Comprueba que los vídeos tengan S01E01 en el título.';return}statusEl.hidden=true;mostrarTemporada(0);seleccionarPrimero()}catch(e){console.error(e);statusEl.textContent='No se pudo cargar la serie. Comprueba series.json y episodios.json.'}}
function actualizarFicha(ep,index){const season=Number((seasonRows[currentSeasonIndex]||{}).dataset?.seasonNumber||currentSeasonIndex+1);const title=document.getElementById('episode-title'),overview=document.getElementById('episode-overview'),details=document.getElementById('episode-details');if(title)title.textContent='T'+String(season).padStart(1,'0')+' - E'+String(ep.numero).padStart(2,'0')+' - '+(ep.titulo||'Capítulo '+ep.numero);if(overview)overview.textContent=ep.sinopsis||ep.overview||'Sin sinopsis disponible para este capítulo.';if(details)details.textContent='Temporada '+season+' | Episodio '+String(ep.numero).padStart(2,'0')}
function crearTemporada(temporada,index){const row=document.createElement('div');row.className='season-row';row.dataset.seasonNumber=temporada.numero;const title=document.createElement('div');title.className='season-title';title.textContent='Temporada '+temporada.numero;const list=document.createElement('div');list.className='episodes-list';const eps=(temporada.capitulos||[]).slice().sort((a,b)=>Number(a.numero)-Number(b.numero));eps.forEach((ep,epIndex)=>{const item=document.createElement('a');item.className='episode-thumb';item.href=ep.url||'#';item.target='_blank';item.rel='noopener noreferrer';item.tabIndex=0;item.dataset.season=String(index);item.dataset.episode=String(epIndex);const img=document.createElement('img');img.loading='lazy';img.alt='';img.src=ep.imagen||'';img.onerror=()=>{img.style.visibility='hidden'};item.append(img);item.addEventListener('focus',()=>{currentSeasonIndex=index;currentEpisodeIndex=epIndex;updateSelected()});item.addEventListener('click',e=>{if(!ep.url)e.preventDefault()});list.appendChild(item)});row.append(title,list);container.appendChild(row);seasonRows.push(row);episodesBySeason.push([...list.querySelectorAll('.episode-thumb')]);episodeRecords.push(eps)}
function mostrarTemporada(i){if(i<0||i>=seasonRows.length)return;seasonRows.forEach((r,n)=>r.style.display=n===i?'block':'none');currentSeasonIndex=i;currentEpisodeIndex=Math.min(currentEpisodeIndex,Math.max(0,episodesBySeason[i].length-1));updateSelected()}
function updateSelected(){document.querySelectorAll('.episode-thumb').forEach(x=>x.classList.remove('selected'));const item=(episodesBySeason[currentSeasonIndex]||[])[currentEpisodeIndex];const ep=(episodeRecords[currentSeasonIndex]||[])[currentEpisodeIndex];if(ep)actualizarFicha(ep,currentEpisodeIndex);if(item){item.classList.add('selected');item.focus({preventScroll:true});item.scrollIntoView({block:'nearest',inline:'nearest',behavior:'auto'})}}
function seleccionarPrimero(){currentEpisodeIndex=0;updateSelected()}
function openCurrent(){const item=(episodesBySeason[currentSeasonIndex]||[])[currentEpisodeIndex];if(item&&item.href&&item.getAttribute('href')!=='#')window.open(item.href,'_blank','noopener')}
document.addEventListener('keydown',e=>{const k=e.key,c=e.keyCode||e.which,up=k==='ArrowUp'||c===38||c===19,down=k==='ArrowDown'||c===40||c===20,left=k==='ArrowLeft'||c===37||c===21,right=k==='ArrowRight'||c===39||c===22,enter=k==='Enter'||c===13||c===23||c===66,back=k==='Escape'||c===27||c===4;const active=document.activeElement;if(back){e.preventDefault();location.href='index.html';return}if(!seasonRows.length)return;if(enter){if(active&&active.classList.contains('episode-thumb'))return;e.preventDefault();openCurrent();return}if(right||left){const arr=episodesBySeason[currentSeasonIndex]||[];if(!arr.length)return;e.preventDefault();currentEpisodeIndex=Math.max(0,Math.min(arr.length-1,currentEpisodeIndex+(right?1:-1)));updateSelected()}else if(down||up){if(seasonRows.length<2)return;e.preventDefault();const next=Math.max(0,Math.min(seasonRows.length-1,currentSeasonIndex+(down?1:-1)));if(next!==currentSeasonIndex){mostrarTemporada(next);seleccionarPrimero()}}},true);iniciar();
</script></body></html>
