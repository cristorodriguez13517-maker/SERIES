name: Actualizar series SharkTV

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install requests
      - name: Actualizar catálogo de series
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          YOUTUBE_SERIES_PLAYLIST_ID: ${{ secrets.YOUTUBE_SERIES_PLAYLIST_ID }}
        run: python actualizar_series.py
      - name: Guardar cambios JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add series.json episodios.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar catálogo automático de series"
            git push
          else
            echo "No hay cambios que guardar"
          fi
