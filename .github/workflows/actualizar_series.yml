
name: Actualizar series SharkTV

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: actualizar-series-sharktv
  cancel-in-progress: false

jobs:
  actualizar-series:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Actualizar series
        run: python actualizar_series.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          YOUTUBE_SERIES_PLAYLIST_ID: PLAeNuSpPHAsk

      - name: Guardar JSON actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add series.json episodios.json

          if git diff --cached --quiet; then
            echo "El catálogo no ha cambiado."
          else
            git commit -m "Actualizar catálogo de series"
            git push
          fi
