<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SharkTV-Series</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}
.header{position:fixed;top:0;left:0;width:100%;height:320px;background-color:#000;background-size:cover;background-position:center;display:flex;align-items:center;padding:20px;z-index:9999;overflow:hidden}
.header::before{content:"";position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.9) 0%,rgba(0,0,0,.75) 35%,transparent 100%),linear-gradient(to bottom,transparent 30%,#000 100%);pointer-events:none}
.header-info{position:relative;z-index:2;max-width:500px;opacity:0;transition:opacity .25s ease}.header-info.visible{opacity:1}.header h1{margin:0}.header h1 img{display:block;max-width:300px;max-height:80px;object-fit:contain;object-position:left center}.details{font-size:14px;font-weight:bold;margin:10px 0;line-height:1.7;max-width:480px}.overview{font-size:12px;line-height:1.45;max-width:450px;margin:8px 0 0}
.content{padding:20px;margin-top:320px;min-height:200px}.movie-row{display:grid;grid-template-columns:repeat(8,105px);gap:12px;margin-top:15px;align-items:start}.movie{display:block;width:105px;height:160px;cursor:pointer;outline:none;text-decoration:none;background:transparent!important;border:none!important;box-shadow:none!important;overflow:hidden;transform:translateZ(0)}.movie[hidden]{display:none!important}.movie img{display:block;width:105px;height:160px;object-fit:cover;border:3px solid transparent;background:transparent!important;outline:none!important;box-shadow:none!important;transition:border-color .15s}.movie.selected img,.movie:focus-visible img{border-color:#E50914}
.movie,.movie:focus,.movie:focus-visible,.movie.selected{background:transparent!important;outline:none!important;box-shadow:none!important}
.movie img{background:transparent!important;box-shadow:none!important}
.search-container{position:fixed;top:20px;right:30px;display:flex;align-items:center;gap:10px;z-index:10001}.search-button{background:transparent;border:0;padding:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;outline:none;border-radius:50%;transform-origin:center;transition:transform .2s ease}.search-button svg{display:block;width:26px;height:26px;fill:white}.search-button:hover,.search-button:focus,.search-button:focus-visible{transform:scale(1.3);outline:none}.search-input{width:0;min-width:0;padding:8px 0;border:0;border-radius:20px;background:rgba(0,0,0,.9);color:#fff;outline:none;opacity:0;pointer-events:none;transition:width .2s,opacity .2s,padding .2s}.search-input.active{width:220px;padding:9px 12px;border:1px solid rgba(255,255,255,.5);opacity:1;pointer-events:auto}.search-input:focus{border-color:rgba(255,255,255,.9)}.status{color:#aaa;font-size:14px;margin-top:20px}
@media(max-width:900px){.movie-row{grid-template-columns:repeat(5,105px)}}@media(max-width:600px){.header{height:320px;padding:15px}.header h1 img{max-width:240px;max-height:70px}.content{margin-top:320px;padding:12px}.movie-row{grid-template-columns:repeat(3,105px);gap:10px}.search-container{right:15px;top:15px}.search-input.active{width:170px}}

/* MISMO TAMAÑO Y DISTRIBUCIÓN DE CARÁTULAS QUE ALLDEBRID */
.movie-row{
  grid-template-columns:repeat(7,130px)!important;
  gap:13px!important;
}
.movie-row .movie{
  width:130px!important;
  min-width:130px!important;
  max-width:130px!important;
  height:180px!important;
}
.movie-row .movie img{
  width:130px!important;
  height:180px!important;
}
@media(max-width:900px){
  .movie-row{grid-template-columns:repeat(5,130px)!important;gap:12px!important}
}
@media(max-width:600px){
  .movie-row{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:10px!important}
  .movie-row .movie{
    width:100%!important;
    min-width:0!important;
    max-width:130px!important;
    height:auto!important;
    aspect-ratio:2 / 3!important;
  }
  .movie-row .movie img{width:100%!important;height:100%!important}
}


/* SINOPSIS COMPLETA EN LA CABECERA: el texto no se recorta.
   Si no cabe en la altura del banner, la zona informativa permite desplazarse. */
.header-info,
.header-info-container{
  max-height:calc(100% - 24px)!important;
  overflow-y:auto!important;
  overflow-x:hidden!important;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.55) rgba(0,0,0,.18);
  overscroll-behavior:contain;
}
.overview{
  display:block!important;
  max-height:none!important;
  height:auto!important;
  overflow:visible!important;
  -webkit-line-clamp:unset!important;
  line-clamp:unset!important;
  white-space:normal!important;
  overflow-wrap:anywhere;
}


 
 /* CARÁTULAS REDONDEADAS Y MARCO ROJO DE SELECCIÓN */
 .movie-row .movie{
   border-radius:12px!important;
   overflow:hidden!important;
 }
 .movie-row .movie img{
   box-sizing:border-box!important;
   border-radius:12px!important;
 }
 .movie-row .movie.selected img,
 .movie-row .movie:focus-visible img{
   border-color:#e50914!important;
 }
 


/* BANNER AMPLIADO: la imagen ocupa más pantalla y se funde a negro abajo.
   La ficha conserva su posición original y la fila sigue comenzando a 320px. */
.header{
  height:520px!important;
  min-height:520px!important;
  background-size:cover!important;
  background-position:center center!important;
  background-repeat:no-repeat!important;
  position:fixed!important;top:0!important;left:0!important;
  z-index:0!important;
  overflow:hidden!important;
  align-items:flex-start!important;
}
.header::before,
.header:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(to right,rgba(0,0,0,.90) 0%,rgba(0,0,0,.55) 35%,transparent 100%),
    linear-gradient(to bottom,rgba(0,0,0,.12) 42%,rgba(0,0,0,.58) 68%,#000 100%)!important;
  pointer-events:none;
}
.header-info{
  position:absolute!important;
  top:160px!important;
  left:20px!important;
  transform:translateY(-50%)!important;
  z-index:2!important;
}
.content{
  position:relative!important;
  z-index:1!important;
  margin-top:320px!important;
}
@media(max-width:600px){
  .header::before,
  .header:before{
    background:
      linear-gradient(to right,rgba(0,0,0,.90) 0%,rgba(0,0,0,.55) 35%,transparent 100%),
      linear-gradient(to bottom,rgba(0,0,0,.12) 48%,rgba(0,0,0,.58) 74%,#000 100%)!important;
  }
  .header{
    height:430px!important;
    min-height:430px!important;
  }
  .header-info{
    top:160px!important;
    left:15px!important;
  }
  .content{
    margin-top:320px!important;
  }
}
</style></head><body>
<div class="search-container"><button id="search-button" class="search-button" type="button" aria-label="Abrir buscador" tabindex="0"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C8.01 14 6 11.99 6 9.5S8.01 5 10.5 5 15 7.01 15 9.5 12.99 14 10.5 14z"/></svg></button><input id="search" class="search-input" type="text" placeholder="Buscar película o serie..." aria-label="Buscar películas y series" autocomplete="off" tabindex="0"></div>
<div class="header" id="header"><div class="header-info" id="info"><h1 id="title"></h1><div id="meta" class="details"></div><p id="overview" class="overview"></p></div></div>
<div class="content"><div class="movie-row" id="movie-row"></div><p class="status" id="status" hidden></p></div>
<script>
/* LOGOS DE BANNER: conservar el color original; los logos oscuros monocromos se muestran en blanco. */
function configurarLogoBanner(img, url){
  // TMDB puede servir logos sin cabeceras CORS: no usar canvas ni crossOrigin,
  // porque eso puede bloquear la propia imagen. Los logos oscuros ya llegan
  // convertidos a blanco desde el actualizador y conservan su transparencia.
  const logoUrl=String(url||'').trim()
    .replace('https://image.tmdb.org/pw780/','https://image.tmdb.org/t/p/w780/')
    .replace('https://image.tmdb.org/t/pw780/','https://image.tmdb.org/t/p/w780/')
    .replace('http://image.tmdb.org/pw780/','https://image.tmdb.org/t/p/w780/');
  img.onload=()=>{
    img.style.filter='drop-shadow(0 1px 2px rgba(0,0,0,.45))';
  };
  img.onerror=()=>{
    img.style.filter='none';
    img.dataset.logoError='true';
  };
  img.removeAttribute('crossorigin');
  img.src=logoUrl;
}

'use strict';
const header=document.getElementById('header'),info=document.getElementById('info'),titleElement=document.getElementById('title'),metaElement=document.getElementById('meta'),overviewElement=document.getElementById('overview'),searchInput=document.getElementById('search'),searchButton=document.getElementById('search-button'),movieRow=document.getElementById('movie-row'),statusElement=document.getElementById('status');
let items=[],selectedMovie=null,sharkVisibleCards=[],sharkLastFocusedRow=-1;
async function getJson(path){const r=await fetch('./'+path+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(path+' HTTP '+r.status);return r.json()}
async function loadCatalog(){statusElement.hidden=false;statusElement.textContent='Cargando contenido...';try{const [series,episodeData]=await Promise.all([getJson('series.json'),getJson('episodios.json')]);if(!Array.isArray(series))throw Error('series.json no contiene una lista');items=series.map(x=>({...x,_kind:'series',_episodes:episodeData[String(x.id)]||episodeData[String(x.tmdb_id)]||[]}));renderItems();if(!items.length)throw Error('No hay series en series.json');}catch(e){console.error(e);statusElement.hidden=false;statusElement.textContent='No se pudo cargar el catálogo. Comprueba series.json y episodios.json.'}}
function titleOf(x){return x.title_manual||x.title||x.name||x.youtube_title||'Sin título'}
function youtubeUrl(x){if(x.youtube_url_manual)return x.youtube_url_manual;if(x.youtube_url)return x.youtube_url;if(x.youtube_id)return 'https://www.youtube.com/watch?v='+encodeURIComponent(x.youtube_id);return ''}
function yearOf(x){if(x.first_air_date)return String(x.first_air_date).slice(0,4);if(x.release_date)return String(x.release_date).slice(0,4);if(x.year)return String(x.year);return ''}
function genresOf(x){if(Array.isArray(x.genres))return x.genres.map(g=>typeof g==='string'?g:(g&&g.name)||'').filter(Boolean).join(', ');return typeof x.genres==='string'?x.genres:(x.genre||'')}
function renderItems(){movieRow.replaceChildren();selectedMovie=null;if(!items.length){statusElement.hidden=false;statusElement.textContent='Todavía no hay películas ni series disponibles.';return}statusElement.hidden=true;items.forEach(item=>{const card=document.createElement('a');card.className='movie';card.tabIndex=0;card.dataset.kind=item._kind;card.dataset.id=item.id||item.tmdb_id||'';card.dataset.title=titleOf(item);card.dataset.logo=item.logo_manual||item.logo||'';card.dataset.banner=item.backdrop_manual||item.backdrop||'';card.dataset.overview=item.overview||'';card.dataset.year=yearOf(item);card.dataset.genres=genresOf(item);card.dataset.quality=item.quality_manual||item.quality||'';card.dataset.age=item.age_rating_manual||item.age_rating||'';const detectedSeasons=(item._episodes||[]).length;card.dataset.seasons=item.seasons_manual||item.seasons||item.season_count||detectedSeasons||'';card.dataset.duration=item.duration_manual||item.runtime_manual||item.duration||item.runtime||'';if(item._kind==='series'){card.href='series.html?id='+encodeURIComponent(item.id||item.tmdb_id||'');}else{const u=youtubeUrl(item);if(u){card.href=u;card.target='_blank';card.rel='noopener noreferrer'}}const poster=document.createElement('img');poster.alt='';poster.loading='lazy';poster.decoding='async';poster.draggable=false;poster.src=(item.poster_manual||item.poster||'').replace(/\/t\/p\/(?:w\d+|original)\//, '/t/p/w500/');if(!poster.src)poster.style.visibility='hidden';poster.addEventListener('error',()=>poster.style.visibility='hidden');card.appendChild(poster);movieRow.appendChild(card);card.addEventListener('focus',()=>selectMovie(card));card.addEventListener('mouseenter',()=>selectMovie(card));card.addEventListener('click',e=>{if(item._kind==='movie'&&!card.href)e.preventDefault();if(item._kind==='series'&&!card.dataset.id)e.preventDefault()})});filterItems()}
function selectMovie(card){
    if(!card||card.hidden)return;
    if(selectedMovie!==card){
        if(selectedMovie)selectedMovie.classList.remove('selected');
        selectedMovie=card;
        card.classList.add('selected');
    }
    clearTimeout(window.__sharkHeaderUpdateTimer);
    window.__sharkHeaderUpdateTimer=setTimeout(()=>{
        if(selectedMovie===card)renderMovieHeader(card);
    },320);
}

function renderMovieHeader(card){
    const b=card.dataset.banner;header.style.backgroundImage=b?'url("'+b+'")':'none';const t=card.dataset.title||'Título';titleElement.replaceChildren();if(card.dataset.logo){const img=document.createElement('img');configurarLogoBanner(img,card.dataset.logo);img.alt=t;img.onerror=()=>{titleElement.replaceChildren();titleElement.textContent=t};titleElement.appendChild(img)}else titleElement.textContent=t;const parts=[];if(card.dataset.year)parts.push(card.dataset.year);if(card.dataset.kind==='series'&&card.dataset.seasons){const s=String(card.dataset.seasons);parts.push(/temporada/i.test(s)?s:(s+' '+(Number(s)===1?'Temporada':'Temporadas')))}if(card.dataset.duration)parts.push(card.dataset.duration);if(card.dataset.genres)parts.push(card.dataset.genres);if(card.dataset.quality)parts.push(card.dataset.quality);if(card.dataset.age)parts.push(/\+$/.test(card.dataset.age)?card.dataset.age:(card.dataset.age+'+'));metaElement.textContent=parts.join(' | ');overviewElement.textContent=card.dataset.overview||'';info.classList.add('visible')
}

function visibleCards(){return sharkVisibleCards};function columns(){if(innerWidth<=600)return 3;if(innerWidth<=900)return 5;return 7}function scrollToCard(c){if(!c)return;const r=c.getBoundingClientRect(),top=325,bottom=innerHeight-12;if(r.top<top)scrollBy(0,r.top-top);else if(r.bottom>bottom)scrollBy(0,r.bottom-bottom)}function focusCard(c){if(c){const i=sharkVisibleCards.indexOf(c),row=i<0?-1:Math.floor(i/columns());c.focus({preventScroll:true});selectMovie(c);if(row!==sharkLastFocusedRow){sharkLastFocusedRow=row;scrollToCard(c)}}}function firstCard(){const c=visibleCards()[0];if(c)focusCard(c)}function openSearch(){movieRow.querySelectorAll('.movie.selected').forEach(card=>card.classList.remove('selected'));selectedMovie=null;searchInput.classList.add('active');searchInput.focus()}function closeSearch(){searchInput.value='';filterItems();searchInput.classList.remove('active');searchInput.blur();searchButton.focus({preventScroll:true})}
document.addEventListener('keydown',e=>{const k=e.key,c=e.keyCode||e.which,up=k==='ArrowUp'||c===38||c===19,down=k==='ArrowDown'||c===40||c===20,left=k==='ArrowLeft'||c===37||c===21,right=k==='ArrowRight'||c===39||c===22,enter=k==='Enter'||c===13||c===23||c===66,esc=k==='Escape'||c===27||c===4,a=document.activeElement,isInput=a===searchInput,isButton=a===searchButton,card=a&&a.closest?a.closest('.movie'):null;if(isInput){if(esc){e.preventDefault();closeSearch()}else if(up){e.preventDefault();searchButton.focus()}else if(down){e.preventDefault();firstCard()}else if(enter){e.preventDefault();firstCard()}return}if(isButton){if(enter){e.preventDefault();openSearch();return}if(down){e.preventDefault();firstCard();return}if(up||left||right){e.preventDefault();return}}if(!card){if(up||left){e.preventDefault();searchButton.focus()}else if(down||right){e.preventDefault();firstCard()}return}const arr=visibleCards(),i=arr.indexOf(card);if(i<0)return;let n=i;if(right)n=Math.min(i+1,arr.length-1);else if(left)n=i%columns()===0?i:i-1;else if(down)n=Math.min(i+columns(),arr.length-1);else if(up){if(i<columns()){e.preventDefault();searchButton.focus();return}n=i-columns()}else if(esc){e.preventDefault();searchButton.focus();return}else return;e.preventDefault();if(arr[n])focusCard(arr[n])},true);
searchButton.addEventListener('click',openSearch);searchInput.addEventListener('input',filterItems);searchInput.addEventListener('blur',()=>{if(!searchInput.value.trim())searchInput.classList.remove('active')});function normalizarTextoBusqueda(valor) {
    return String(valor || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLocaleLowerCase('es');
}

function filterItems(){
    const q = normalizarTextoBusqueda(searchInput.value.trim());
    let first = null;
    const all = movieRow.querySelectorAll('.movie');
    all.forEach(card => {
        const text = normalizarTextoBusqueda([
            card.dataset.title, card.dataset.year, card.dataset.genres,
            card.dataset.quality, card.dataset.age, card.dataset.overview,
            card.dataset.kind
        ].join(' '));
        card.hidden = !text.includes(q);
        if (!card.hidden && !first) first = card;
    });
    sharkVisibleCards = Array.from(all).filter(card => !card.hidden);
    sharkLastFocusedRow = -1;
    if (selectedMovie) selectedMovie.classList.remove('selected');
    selectedMovie = null;
    if (!first && q) {
        selectedMovie = null;
        info.classList.remove('visible');
        header.style.backgroundImage = 'none';
    }
}
window.addEventListener('resize',()=>{if(selectedMovie&&!selectedMovie.hidden)selectMovie(selectedMovie)});
async function startSharkTV(){
  await loadCatalog();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const first=visibleCards()[0];
    if(first) focusCard(first);
  }));
}
startSharkTV();
</script></body></html>

<style>
/* Menor separación horizontal entre carátulas */
.movie-row{column-gap:8px!important}
@media(max-width:900px){.movie-row{column-gap:8px!important}}
@media(max-width:600px){.movie-row{column-gap:7px!important}}
</style>
