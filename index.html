------------------------------------------------------- */

------------------------------------------------------- */

/* -------------------------------------------------------
   LISTA DE CAPÃTULOS
------------------------------------------------------- */

/* -------------------------------------------------------
   MINIATURA DEL CAPÃTULO
------------------------------------------------------- */

  position: relative;

  touch-action: none;

.episode-thumb img {

  display: block;

  border-radius: 4px;

/* -------------------------------------------------------

------------------------------------------------------- */

/* -------------------------------------------------------
   QUITAR MARCO AMARILLO
------------------------------------------------------- */

*:focus,
*:focus-visible {

  outline: none !important;

  box-shadow: none !important;
}


/* Evitar menÃº contextual al mantener pulsado

.episode-thumb,
.episode-thumb img {

  -webkit-touch-callout: none;

<script>


/* =====================================================
   ELEMENTOS
===================================================== */

const header =
  document.getElementById("header");


const headerInfoContainer =
  document.getElementById(
    "header-info-container"
  );


const headerInfo =
  document.getElementById(
    "header-info"
  );


const container =
  document.getElementById(
    "series-container"
  );


/* =====================================================
   VARIABLES
===================================================== */

let seasonRows = [];

let episodesBySeason = [];

let episodesData = [];

let currentSeasonIndex = 0;

let currentEpisodeIndex = 0;


/* =====================================================
   INICIAR
===================================================== */

function iniciar() {


  /* ---------------------------------------------------
     BANNER
  --------------------------------------------------- */

  if (SERIE.banner) {

    header.style.backgroundImage =
      `url("${SERIE.banner}")`;

  }


  header.classList.add("active");

  headerInfoContainer.classList.add(
    "visible"
  );


  /* ---------------------------------------------------
     INFORMACIÃ“N INICIAL
  --------------------------------------------------- */

  mostrarInformacionSerie();


  /* ---------------------------------------------------
     CREAR TEMPORADAS
  --------------------------------------------------- */

  SERIE.temporadas.forEach(
    crearTemporada
  );


  /* ---------------------------------------------------
     MOSTRAR PRIMERA TEMPORADA
  --------------------------------------------------- */

  if (seasonRows.length > 0) {

    seasonRows[0].style.display =
      "block";

  }


  actualizarSeleccion();

}


/* =====================================================
   INFORMACIÃ“N DE LA SERIE
===================================================== */

function mostrarInformacionSerie() {


  headerInfo.innerHTML = `

    ${
      SERIE.logo

      ?

      `
      <img
        src="${SERIE.logo}"
        alt="${SERIE.titulo}"
      >
      `

      :

      `
      <h1>${SERIE.titulo}</h1>
      `
    }


    <div class="details">

      ${SERIE.detalles}

    </div>


    <p class="overview">

      ${SERIE.descripcion}

    </p>

  `;

}


/* =====================================================
   CREAR TEMPORADA
===================================================== */

function crearTemporada(
  temporada,
  seasonIndex
) {


  const row =
    document.createElement("div");


  row.className =
    "season-row";


  /* ---------------------------------------------------
     TÃTULO
  --------------------------------------------------- */

  const title =
    document.createElement("div");


  title.className =
    "season-title";


  title.textContent =
    `Temporada ${temporada.numero}`;


  /* ---------------------------------------------------
     LISTA
  --------------------------------------------------- */

  const list =
    document.createElement("div");


  list.className =
    "episodes-list";


  const thumbs = [];

  const datos = [];


  /* ---------------------------------------------------
     CREAR CAPÃTULOS
  --------------------------------------------------- */

  temporada.capitulos.forEach(
    (capitulo, episodeIndex) => {


      const elemento =
        document.createElement("div");


      elemento.className =
        "episode-thumb";


      elemento.tabIndex = 0;


      /* -----------------------------------------------
         MINIATURA
      ----------------------------------------------- */

      elemento.innerHTML = `

        <img
          src="${capitulo.imagen}"
          alt="${capitulo.titulo}"
        >

      `;


      /* -----------------------------------------------
         CLIC / TÃCTIL

         MÃ“VIL / TABLET:
         - Toque corto: selecciona y abre
         - PulsaciÃ³n larga: selecciona y NO abre
         - Otro toque: abre

         PC:
         - Click: selecciona y abre
      ----------------------------------------------- */

      let touchTimer = null;
      let touchIsLong = false;
      let touchMoved = false;
      let ignoreNextClick = false;
      let touchStartX = 0;
      let touchStartY = 0;


      /* ===================================================
         INICIO DEL TOQUE
      =================================================== */

      elemento.addEventListener(
        "touchstart",
        (evento) => {

          if (
            !evento.touches ||
            evento.touches.length !== 1
          ) {
            return;
          }

          const touch =
            evento.touches[0];

          touchStartX =
            touch.clientX;

          touchStartY =
            touch.clientY;

          touchIsLong = false;
          touchMoved = false;


          touchTimer =
            setTimeout(() => {

              if (touchMoved) {
                return;
              }

              touchIsLong = true;

              /*
                 SELECCIONAR EL CAPÃTULO
                 SIN ABRIRLO
              */

              currentSeasonIndex =
                seasonIndex;

              currentEpisodeIndex =
                episodeIndex;

              actualizarSeleccion();

            }, 600);

        },
        { passive: true }
      );


      /* ===================================================
         DETECTAR SI EL DEDO SE ESTÃ MOVIENDO
      =================================================== */

      elemento.addEventListener(
        "touchmove",
        (evento) => {

          if (
            !evento.touches ||
            evento.touches.length !== 1
          ) {
            return;
          }

          const touch =
            evento.touches[0];

          const dx =
            touch.clientX -
            touchStartX;

          const dy =
            touch.clientY -
            touchStartY;

          if (
            Math.abs(dx) > 15 ||
            Math.abs(dy) > 15
          ) {

            touchMoved = true;

            if (touchTimer) {

              clearTimeout(
                touchTimer
              );

              touchTimer = null;

            }

          }

        },
        { passive: true }
      );


      /* ===================================================
         FIN DEL TOQUE
      =================================================== */

      elemento.addEventListener(
        "touchend",
        (evento) => {

          if (touchTimer) {

            clearTimeout(
              touchTimer
            );

            touchTimer = null;

          }


          /*
             SI FUE PULSACIÃ“N LARGA:
             ya hemos seleccionado el capÃ­tulo.
             NO hacemos nada mÃ¡s.
          */

          if (touchIsLong) {

            ignoreNextClick = true;

            return;

          }


          /*
             SI HUBO MOVIMIENTO:
             era un gesto/scroll, no un click.
          */

          if (touchMoved) {

            ignoreNextClick = true;

            return;

          }


          /*
             TOQUE CORTO:
             seleccionar y abrir.
          */

          currentSeasonIndex =
            seasonIndex;

          currentEpisodeIndex =
            episodeIndex;

          actualizarSeleccion();

          abrirCapitulo(capitulo);

        },
        { passive: true }
      );


      /* ===================================================
         CLICK DE RATÃ“N / CLICK GENERADO POR EL NAVEGADOR
      =================================================== */

      elemento.addEventListener(
        "click",
        (evento) => {

          /*
             El navegador puede generar un click
             despuÃ©s de un touchend.

             Si fue una pulsaciÃ³n larga o un gesto,
             lo bloqueamos para evitar que abra.
          */

          if (ignoreNextClick) {

            evento.preventDefault();

            evento.stopPropagation();

            ignoreNextClick = false;

            return;

          }


          /*
             Si el click viene de un ratÃ³n,
             funciona como antes.
          */

          if (
            evento.pointerType === "mouse" ||
            !evento.pointerType
          ) {

            currentSeasonIndex =
              seasonIndex;

            currentEpisodeIndex =
              episodeIndex;

            actualizarSeleccion();

            abrirCapitulo(capitulo);

          }

        }
      );


      /* ===================================================
         EVITAR MENÃš CONTEXTUAL DE ESTE CAPÃTULO
      =================================================== */

      elemento.addEventListener(
        "contextmenu",
        (evento) => {

          evento.preventDefault();

        }
      );


      /* -----------------------------------------------
         ENTER
      ----------------------------------------------- */

      elemento.addEventListener(
        "keydown",
        (evento) => {

          if (evento.key === "Enter") {

            evento.preventDefault();

            currentSeasonIndex =
              seasonIndex;

            currentEpisodeIndex =
              episodeIndex;

            actualizarSeleccion();

            abrirCapitulo(capitulo);

          }

        }
      );


      list.appendChild(elemento);

      thumbs.push(elemento);

      datos.push(capitulo);

    }
  );


  /* ---------------------------------------------------
     AÃ‘ADIR A LA PÃGINA
  --------------------------------------------------- */

  row.appendChild(title);

  row.appendChild(list);

  container.appendChild(row);


  seasonRows.push(row);

  episodesBySeason.push(thumbs);

  episodesData.push(datos);

}


/* =====================================================
   ABRIR CAPÃTULO
===================================================== */

function abrirCapitulo(capitulo) {


  if (
    !capitulo ||
    !capitulo.url
  ) {

    return;

  }


  window.location.href =
    capitulo.url;

}


/* =====================================================
   ACTUALIZAR HEADER
===================================================== */

function actualizarHeader(
  capitulo
) {


  if (!capitulo) {

    return;

  }


  const temporada =
    SERIE.temporadas[
      currentSeasonIndex
    ];


  const numeroTemporada =
    temporada.numero;


  const numeroCapitulo =
    capitulo.numero;


  const codigo =
    `T${numeroTemporada} - E${
      String(numeroCapitulo)
        .padStart(2, "0")
    }`;


  headerInfo.innerHTML = `

    ${
      SERIE.logo

      ?

      `
      <img
        src="${SERIE.logo}"
        alt="${SERIE.titulo}"
      >
      `

      :

      `
      <h1>${SERIE.titulo}</h1>
      `
    }


    <div class="details">

      ${codigo} - ${capitulo.titulo}

    </div>


    <p class="overview">

      ${
        capitulo.descripcion ||
        "Sin sinopsis disponible"
      }

    </p>

  `;

}


/* =====================================================
   ACTUALIZAR SELECCIÃ“N
===================================================== */

function actualizarSeleccion() {


  /* ---------------------------------------------------
     QUITAR SELECCIÃ“N ANTERIOR
  --------------------------------------------------- */

  episodesBySeason.forEach(
    temporada => {

      temporada.forEach(
        capitulo => {

          capitulo.classList.remove(
            "selected"
          );

        }
      );

    }
  );


  /* ---------------------------------------------------
     CAPÃTULO ACTUAL
  --------------------------------------------------- */

  const temporadaActual =
    episodesBySeason[
      currentSeasonIndex
    ];


  const datosTemporada =
    episodesData[
      currentSeasonIndex
    ];


  if (
    !temporadaActual ||
    !datosTemporada
  ) {

    return;

  }


  const capituloActual =
    temporadaActual[
      currentEpisodeIndex
    ];


  const datosCapitulo =
    datosTemporada[
      currentEpisodeIndex
    ];


  /* ---------------------------------------------------
     MARCAR CAPÃTULO
  --------------------------------------------------- */

  if (capituloActual) {

    capituloActual.classList.add(
      "selected"
    );


    capituloActual.scrollIntoView({

      behavior: "smooth",

      inline: "center",

      block: "nearest"

    });

  }


  /* ---------------------------------------------------
     ACTUALIZAR INFORMACIÃ“N
  --------------------------------------------------- */

  actualizarHeader(
    datosCapitulo
  );

}


/* =====================================================
   MOSTRAR TEMPORADA
===================================================== */

function mostrarTemporada(index) {


  seasonRows.forEach(
    temporada => {

      temporada.style.display =
        "none";

    }
  );


  if (seasonRows[index]) {

    seasonRows[index].style.display =
      "block";

  }

}


/* =====================================================
   TECLADO
===================================================== */

document.addEventListener(
  "keydown",
  (evento) => {


    const temporadaActual =
      episodesBySeason[
        currentSeasonIndex
      ];


    if (!temporadaActual) {

      return;

    }


    /* -------------------------------------------------
       DERECHA
    ------------------------------------------------- */

    if (
      evento.key === "ArrowRight"
    ) {

      evento.preventDefault();


      if (
        currentEpisodeIndex <
        temporadaActual.length - 1
      ) {

        currentEpisodeIndex++;

        actualizarSeleccion();

      }

    }


    /* -------------------------------------------------
       IZQUIERDA
    ------------------------------------------------- */

    else if (
      evento.key === "ArrowLeft"
    ) {

      evento.preventDefault();


      if (
        currentEpisodeIndex > 0
      ) {

        currentEpisodeIndex--;

        actualizarSeleccion();

      }

    }


    /* -------------------------------------------------
       ABAJO
    ------------------------------------------------- */

    else if (
      evento.key === "ArrowDown"
    ) {

      evento.preventDefault();


      if (
        currentSeasonIndex <
        episodesBySeason.length - 1
      ) {

        currentSeasonIndex++;

        currentEpisodeIndex = 0;


        mostrarTemporada(
          currentSeasonIndex
        );


        actualizarSeleccion();

      }

    }


    /* -------------------------------------------------
       ARRIBA
    ------------------------------------------------- */

    else if (
      evento.key === "ArrowUp"
    ) {

      evento.preventDefault();


      if (
        currentSeasonIndex > 0
      ) {

        currentSeasonIndex--;

        currentEpisodeIndex = 0;


        mostrarTemporada(
          currentSeasonIndex
        );


        actualizarSeleccion();

      }

    }


    /* -------------------------------------------------
       ENTER
    ------------------------------------------------- */

    else if (
      evento.key === "Enter"
    ) {

      evento.preventDefault();


      const capitulo =
        episodesData[
          currentSeasonIndex
        ][
          currentEpisodeIndex
        ];


      abrirCapitulo(
        capitulo
      );

    }

  }
);


/* =====================================================
   EVITAR MENÃš CONTEXTUAL EN PULSACIÃ“N LARGA
===================================================== */

document.addEventListener(
  "contextmenu",
  (evento) => {

    if (
      evento.target.closest &&
      evento.target.closest(".episode-thumb")
    ) {
      evento.preventDefault();
    }

  }
);


/* =====================================================
   CONTROL TÃCTIL / MÃ“VIL / TABLET
===================================================== */

let touchStartX = 0;
let touchStartY = 0;
let touchStartTime = 0;

document.addEventListener(
  "touchstart",
  (evento) => {

    if (
      !evento.touches ||
      evento.touches.length !== 1
    ) {
      return;
    }

    touchStartX =
      evento.touches[0].clientX;

    touchStartY =
      evento.touches[0].clientY;

    touchStartTime = Date.now();

  },
  { passive: true }
);


document.addEventListener(
  "touchend",
  (evento) => {

    if (
      !evento.changedTouches ||
      evento.changedTouches.length !== 1
    ) {
      return;
    }

    const touch =
      evento.changedTouches[0];

    const touchEndX =
      touch.clientX;

    const touchEndY =
      touch.clientY;

    const diferenciaX =
      touchEndX - touchStartX;

    const diferenciaY =
      touchEndY - touchStartY;

    const tiempo =
      Date.now() - touchStartTime;


    /* ---------------------------------------------------
       IGNORAR GESTOS DEMASIADO LARGOS
    --------------------------------------------------- */

    if (tiempo > 800) {
      return;
    }


    /* ---------------------------------------------------
       IGNORAR DESLIZAMIENTOS HORIZONTALES
       PARA NO INTERFERIR CON LOS CAPÃTULOS
    --------------------------------------------------- */

    if (
      Math.abs(diferenciaX) >
      Math.abs(diferenciaY)
    ) {
      return;
    }


    /* ---------------------------------------------------
       DISTANCIA MÃNIMA DEL GESTO
    --------------------------------------------------- */

    if (
      Math.abs(diferenciaY) < 60
    ) {
      return;
    }


    /* ===================================================
       DESLIZAR HACIA ARRIBA
       â†’ SIGUIENTE TEMPORADA
    =================================================== */

    if (diferenciaY < 0) {

      if (
        currentSeasonIndex <
        episodesBySeason.length - 1
      ) {

        currentSeasonIndex++;

        currentEpisodeIndex = 0;

        mostrarTemporada(
          currentSeasonIndex
        );

        actualizarSeleccion();

      }

    }


    /* ===================================================
       DESLIZAR HACIA ABAJO
       â†’ TEMPORADA ANTERIOR
    =================================================== */

    else {

      if (
        currentSeasonIndex > 0
      ) {

        currentSeasonIndex--;

        currentEpisodeIndex = 0;

        mostrarTemporada(
          currentSeasonIndex
        );

        actualizarSeleccion();

      }

    }

  },
  { passive: true }
);


/* =====================================================
   ARRANCAR LA PLANTILLA
===================================================== */

window.addEventListener(
  "load",
  iniciar
);

</script>
