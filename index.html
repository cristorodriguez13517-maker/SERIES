<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Netflix Smart TV - Series</title>

<style>
* { box-sizing: border-box; }
body { margin:0; background:#000; color:#fff; font-family:Arial,sans-serif; overflow-x:hidden; }

.header { 
  position: relative; 
  width: 100%; 
  height: 320px; 
  background-size: cover; 
  background-position: center; 
  display:flex; 
  align-items:center; 
  padding:20px; 
  overflow:hidden; 
  z-index:1; 
  transition: background-image 0.8s ease-in-out; 
}
.header::before { 
  content:""; 
  position:absolute; 
  inset:0; 
  background: linear-gradient(to right, rgba(0,0,0,0.89) 0%, rgba(0,0,0,0) 40%), 
              linear-gradient(to bottom, rgba(0,0,0,0) 20%, rgba(0,0,0,1) 100%); 
  z-index:1; 
}
.header.active::before { 
  background: linear-gradient(to right, rgba(0,0,0,0.89) 0%, rgba(0,0,0,0.89) 40%, rgba(0,0,0,0) 100%), 
              linear-gradient(to bottom, rgba(0,0,0,0) 20%, rgba(0,0,0,1) 100%); 
}

.header-info-container { 
  position: relative; 
  z-index:2; 
  max-width:470px; 
  opacity:0; 
  transition:opacity 0.3s; 
}
.header-info-container.visible { opacity:1; }

.header-info img { max-width:300px; max-height:80px; display:block; margin-bottom:5px; }
.header-info h1 { margin:0; font-size:32px; }
.header-info .details { font-size:14px; font-weight:bold; margin:4px 0; }
.header-info .overview { font-size:12px; max-height:200px; overflow:auto; }

.content { padding:20px; }
.series-container { display:block; }

.season-row { display:none; margin-bottom:25px; }
.season-title { font-size:18px; margin-bottom:10px; }

.episodes-list { display:flex; gap:12px; overflow-x:auto; scroll-behavior:smooth; }
.episode-thumb { position: relative; flex:0 0 auto; width:220px; cursor:pointer; border-radius:4px; overflow:hidden; border:3px solid transparent; transition: transform 0.3s ease, border 0.2s ease; }
.episode-thumb img { width:100%; height:124px; object-fit:cover; display:block; border-radius:4px; }
.episode-thumb.selected { border:3px solid #E50914; }


</style>
</head>

<body>

<div class="header" id="header">
  <div class="header-info-container" id="header-info-container">
    <div class="header-info" id="header-info"></div>
  </div>
</div>

<div class="content">
  <div class="series-container" id="series-container"></div>
</div>

<script>
const apiKey = 'd37846975ba7a3ed227604f30b0f9c16';
const language = 'es-ES';

const header = document.getElementById('header');
const headerInfoContainer = document.getElementById('header-info-container');
const headerInfo = document.getElementById('header-info');
const container = document.getElementById('series-container');

let seasonRows = [];
let episodesBySeason = [];
let episodesData = [];

let currentSeasonIndex = 0;
let currentEpisodeIndex = 0;

let tvId = null;
let totalSeasons = 0;

let seriesDetails = null;

// 🔥 CACHE
const seasonCache = {};

async function fetchJSON(url){
  const res = await fetch(url);
  return await res.json();
}

async function load(){
  const search = await fetchJSON(
    `https://api.themoviedb.org/3/search/tv?api_key=${apiKey}&language=${language}&query=miercoles`
  );

  tvId = search.results[0].id;

  const details = await fetchJSON(
    `https://api.themoviedb.org/3/tv/${tvId}?api_key=${apiKey}&language=${language}&append_to_response=images`
  );

  seriesDetails = details;
  totalSeasons = details.number_of_seasons;

  header.style.backgroundImage = `url('https://image.tmdb.org/t/p/original${details.backdrop_path}')`;
  header.classList.add('active');
  headerInfoContainer.classList.add('visible');

  const logo = (details.images.logos || []).find(l=>l.iso_639_1==='es') || details.images.logos?.[0];

  headerInfo.innerHTML = `
    ${logo ? `<img src="https://image.tmdb.org/t/p/original${logo.file_path}">` : `<h1>${details.name}</h1>`}
    <div class="details">Serie | ${details.first_air_date?.split('-')[0] || ''} | ${totalSeasons} temporadas</div>
    <p class="overview">${details.overview || ''}</p>
  `;

  await loadSeason(1);

  seasonRows[0].style.display = 'block';
  updateSelection();
}

// 🔥 Lazy load temporadas
async function loadSeason(seasonNumber){
  if(seasonCache[seasonNumber]) return;

  const season = await fetchJSON(
    `https://api.themoviedb.org/3/tv/${tvId}/season/${seasonNumber}?api_key=${apiKey}&language=${language}`
  );

  seasonCache[seasonNumber] = season;

  const row = document.createElement('div');
  row.className = 'season-row';

  const title = document.createElement('div');
  title.className = 'season-title';
  title.textContent = `Temporada ${seasonNumber}`;

  const list = document.createElement('div');
  list.className = 'episodes-list';

  let thumbs = [];
  let epsData = [];

  season.episodes.forEach(ep=>{
    const div = document.createElement('div');
    div.className = 'episode-thumb';

    div.innerHTML = `
      <img src="https://image.tmdb.org/t/p/w500${ep.still_path}">
      
    `;

    list.appendChild(div);

    thumbs.push(div);
    epsData.push(ep);
  });

  row.appendChild(title);
  row.appendChild(list);
  container.appendChild(row);

  seasonRows.push(row);
  episodesBySeason.push(thumbs);
  episodesData.push(epsData);
}

// 🔥 HEADER con formato T1 - E01
function updateHeader(ep){
  if(!ep || !seriesDetails) return;

  const logo = (seriesDetails.images.logos || []).find(l=>l.iso_639_1==='es') || seriesDetails.images.logos?.[0];

  const seasonNum = currentSeasonIndex + 1;
  const episodeNum = ep.episode_number;

  const formatted = `T${seasonNum} - E${String(episodeNum).padStart(2,'0')}`;

  headerInfo.innerHTML = `
    ${logo ? `<img src="https://image.tmdb.org/t/p/original${logo.file_path}">` : `<h1>${seriesDetails.name}</h1>`}
    <div class="details">${formatted} - ${ep.name}</div>
    <p class="overview">${ep.overview || 'Sin sinopsis disponible'}</p>
  `;
}

function updateSelection(){
  episodesBySeason.forEach(s=>s.forEach(e=>e.classList.remove('selected')));

  const current = episodesBySeason[currentSeasonIndex];
  const data = episodesData[currentSeasonIndex];

  if(!current || !data) return;

  const ep = current[currentEpisodeIndex];
  const epData = data[currentEpisodeIndex];

  if(ep){
    ep.classList.add('selected');
    ep.scrollIntoView({behavior:'smooth', inline:'center'});
  }

  updateHeader(epData);
}

// 🎮 CONTROLES TV
document.addEventListener('keydown', async (e)=>{

  const current = episodesBySeason[currentSeasonIndex];
  if(!current) return;

  if(e.key==='ArrowRight'){
    if(currentEpisodeIndex < current.length-1) currentEpisodeIndex++;
  }

  if(e.key==='ArrowLeft'){
    if(currentEpisodeIndex > 0) currentEpisodeIndex--;
  }

  if(e.key==='ArrowDown'){
    if(currentSeasonIndex < totalSeasons-1){
      currentSeasonIndex++;
      currentEpisodeIndex = 0;

      await loadSeason(currentSeasonIndex + 1);

      seasonRows.forEach(r=>r.style.display='none');
      seasonRows[currentSeasonIndex].style.display='block';
    }
  }

  if(e.key==='ArrowUp'){
    if(currentSeasonIndex > 0){
      currentSeasonIndex--;
      currentEpisodeIndex = 0;

      seasonRows.forEach(r=>r.style.display='none');
      seasonRows[currentSeasonIndex].style.display='block';
    }
  }

  updateSelection();
});

window.onload = load;
</script>

</body>
</html>
